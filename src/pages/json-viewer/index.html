<!-- Auto-activating JSON viewer (spec §5). -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JSON</title>
<link rel="stylesheet" href="/_shared/styles/tokens.css">
