<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Blocked while you focus</title>
  <link rel="stylesheet" href="aether://_pages/../_shared/base.css" onerror="this.remove()">
  <!--
    Shown when the study blocker (spec §6) cancels a navigation.

    The tone here is a deliberate product decision. A blocker that scolds gets
    switched off within a week; one that simply states the situation and shows
    the time remaining gets left on. There is no "continue anyway" button,
    because a one-click bypass is not a blocker — but stopping the timer is
    two clicks away in the sidebar and the page says so, since a blocker you
    cannot escape at all is one people uninstall rather than pause.
  -->
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7f9;
      --fg: #16181d;
      --muted: #5a6270;
      --card: #ffffff;
      --line: rgba(16, 22, 38, 0.10);
      --accent: #0ea5e9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115; --fg: #e6edf3; --muted: #8b98a8;
        --card: #161a20; --line: rgba(148, 163, 184, 0.16);
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--fg);
      font: 15px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    main {
      width: min(460px, 100%);
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--card);
      text-align: center;
    }

    .mark {
      width: 48px; height: 48px;
      margin: 0 auto 18px;
      display: grid; place-items: center;
      border-radius: 50%;
      background: color-mix(in oklab, var(--accent) 14%, transparent);
      color: var(--accent);
    }
    .mark svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; }

    h1 { margin: 0 0 8px; font-size: 20px; font-weight: 600; }
    p  { margin: 0 0 6px; color: var(--muted); font-size: 14px; }
    .host { font-weight: 600; color: var(--fg); }

    #clock {
      margin: 20px 0 4px;
      font: 600 34px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      font-variant-numeric: tabular-nums;
    }
    #phase { font-size: 12px; color: var(--muted); }

    .hint {
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <div class="mark">
      <svg viewBox="0 0 24 24"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7v5l3 2"/></svg>
    </div>

    <h1 id="headline">Not right now</h1>
    <p><span class="host" id="host">This site</span> <span id="reason">is on your block list while you focus.</span></p>

    <div id="clock" hidden>--:--</div>
    <div id="phase" hidden></div>

    <p class="hint">
      Breaks unblock automatically. To stop early, open the Study panel in the
      sidebar and end the session — this page has no bypass on purpose.
    </p>
  </main>

  <script src="blocked.js"></script>
</body>
</html>
