<!--
  Overlay view.

  A transparent WebContentsView attached *above* the page views, and only
  while something needs to draw over page content: the command palette, the
  screenshot region selector, and the colour picker. It is detached when idle
  so it never intercepts clicks meant for the page.
-->
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'">
<title>Shaurya Overlay</title>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/overlay.css">

<div id="overlay-root"></div>

<script type="module" src="overlay.js"></script>
