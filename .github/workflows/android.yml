# Builds the Android APK.
#
# The Android SDK only ships from dl.google.com, which is not reachable from
# every development environment — so this workflow is the reliable path to an
# installable APK. Push to a branch or run it manually and download the
# artifact.
name: Android APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Needed so the APK can be published to the dist branch below.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Run unit tests
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        working-directory: android
        run: ./gradlew --no-daemon lintDebug
        continue-on-error: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aether-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      # Actions artifacts are served from an authenticated, short-lived blob
      # URL that some corporate and sandboxed networks block outright. Mirroring
      # the APK onto a throwaway branch gives a second retrieval path that is
      # plain git, so anything able to clone the repository can fetch the
      # binary.
      #
      # The branch is rebuilt from an empty history and force-pushed every run,
      # so it never accumulates more than the single APK it currently holds.
      # The file deliberately sits outside android/ so that this push cannot
      # match the path filter that triggers this workflow.
      - name: Mirror the APK to the dist branch
        env:
          APK: android/app/build/outputs/apk/debug/app-debug.apk
          REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          test -f "$APK"

          work="$(mktemp -d)"
          mkdir -p "$work/apk"
          cp "$APK" "$work/apk/aether-debug.apk"
          printf '%s\n' \
            '# Aether — debug APK' '' \
            "Built by the \"Android APK\" workflow from commit \`$GITHUB_SHA\`." '' \
            '    apk/aether-debug.apk' '' \
            'Debug-signed, so installing needs "unknown sources" enabled:' '' \
            '    adb install apk/aether-debug.apk' '' \
            'This branch is force-pushed on every build and carries no history.' \
            'It is a distribution convenience, not source. Delete it freely.' \
            > "$work/README.md"

          cd "$work"
          git init -q -b dist
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "Aether debug APK from ${GITHUB_SHA:0:7}"
          git push -q --force "$REMOTE" dist:refs/heads/claude/apk-dist
          echo "APK mirrored to branch claude/apk-dist"
