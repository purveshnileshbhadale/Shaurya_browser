# Desktop build: unit tests plus the end-to-end smoke test, which boots the
# real browser under a virtual display and screenshots it.
name: Desktop

on:
  push:
    paths-ignore:
      - 'android/**'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: node --test "test/*.test.js"

      - name: Install a virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: End-to-end smoke test
        run: npm run smoke

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: test-results/
          if-no-files-found: ignore
